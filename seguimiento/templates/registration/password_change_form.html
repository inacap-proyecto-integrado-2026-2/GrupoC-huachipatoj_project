{% extends 'seguimiento/base.html' %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Cambiar contraseña</h1>
      <p class="muted">Actualiza tu clave de acceso al sistema del club.</p>
    </div>
  </div>

  <form class="card edit" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit">Actualizar contraseña</button>
      <a class="button button-secondary" href="{% url 'panel_entrenador' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
