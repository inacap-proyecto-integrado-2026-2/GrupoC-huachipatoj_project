{% extends 'seguimiento/base.html' %}

{% block content %}
  <div class="auth-card">
    <h2>Ingresar al club</h2>
    <p class="muted">Accede con tu usuario de entrenador o con tu RUT (con o sin puntos ni guión).</p>

    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="errorlist">Usuario o contraseña incorrectos.</div>
      {% endif %}
      <p>
        <label for="username">Usuario o RUT</label>
        <input id="username" name="username" autocomplete="username" placeholder="Ej: 12.345.678-5" required>
      </p>
      <p>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="button-block">Ingresar</button>
    </form>
  </div>
  <div class="auth-footer">
    <a href="{% url 'crear_cuenta' %}">Solicitar acceso</a>
  </div>
{% endblock %}
