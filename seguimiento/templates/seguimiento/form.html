{% extends 'seguimiento/base.html' %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>{{ titulo }}</h1>
      {% if ayuda %}
        <p class="muted">{{ ayuda }}</p>
      {% endif %}
    </div>
  </div>

  <form class="card edit" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit">{{ submit_label|default:'Guardar' }}</button>
      <a class="button button-secondary" href="{{ cancel_url|default:'/' }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
